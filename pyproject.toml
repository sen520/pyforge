[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pyforge"
version = "0.1.0"
description = "面向个人 GPU 的 Python 编程助手微调工具"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
train = [
  # CUDA 构建需先从官方 cu124 源安装；版本声明本身不选择 CUDA 安装源。
  "torch==2.6.0",
  "transformers>=4.51,<5",
  "peft>=0.15,<0.19",
  "accelerate>=1.6,<2",
  "bitsandbytes>=0.45,<0.49",
]

[project.scripts]
pyforge = "pyforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
